[build]
  command = "node scripts/migrate.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let the client router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Shown as a form field by the "Deploy to Netlify" setup link.
[template.environment]
  DATABASE_URL = "Neon pooled connection string (postgresql://...)"
