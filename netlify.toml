[build]
  command = "node scripts/migrate.mjs && npm run build"
  publish = "dist"
  # Skip the build (and its 15-credit production deploy) when only docs, notes or the
  # CLI source changed. The served copy of the CLI is public/artache-sync.mjs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md' ':(exclude)docs/' ':(exclude)cli/'"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: let the client router handle every path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Shown as a form field by the "Deploy to Netlify" setup link.
[template.environment]
  DATABASE_URL = "Neon pooled connection string (postgresql://...)"
